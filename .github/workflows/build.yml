name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing ships unless lint and the unit tests pass first.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            script: build
            artifact: dist/*.exe
          - os: ubuntu-latest
            platform: linux
            script: build:linux
            artifact: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build ${{ matrix.platform }} package
        run: npm run ${{ matrix.script }}
        env:
          # Unsigned builds — no certificate is configured for this project.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-package
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # Only a tag publishes. A manual run is a dry build of both platforms.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be released
        run: ls -lh dist

      # The notes are the tag's own CHANGELOG entry — screenshots and all —
      # rather than a fixed blurb that says nothing about this release.
      - name: Compose release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { inside = 1; next }
              inside && /^## \[/       { exit }
              inside                   { print }
            ' CHANGELOG.md
            cat <<'FOOT'

          ### Downloads

          | Platform | File | Notes |
          |---|---|---|
          | Windows 10/11 | `TelegramFreeRich-Setup-*.exe` | Installer, per user — no admin rights needed |
          | Windows 10/11 | `TelegramFreeRich-*-portable.exe` | Runs as-is, nothing to install or uninstall |
          | Linux | `TelegramFreeRich-*.AppImage` | `chmod +x` and run |

          Both packages are unsigned; Windows SmartScreen warns on first run.
          FOOT
          } > notes.md
          echo "── release notes ──"
          cat notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
          generate_release_notes: true
          body_path: notes.md
